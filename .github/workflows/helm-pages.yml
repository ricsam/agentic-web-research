name: Publish public Helm repository

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/repo/**"
      - ".github/workflows/helm-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Validate packaged charts
        run: |
          test -s deploy/helm/repo/index.yaml
          for archive in deploy/helm/repo/*.tgz; do
            helm lint "$archive"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/helm/repo
      - name: Deploy public chart repository
        id: deployment
        uses: actions/deploy-pages@v4
