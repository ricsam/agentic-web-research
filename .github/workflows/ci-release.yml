name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: azure/setup-helm@v4
      - run: bun install --frozen-lockfile
      - run: bun test packages/core/src apps/server/src
      - run: bun run typecheck
      - run: bun run build
      - run: helm lint deploy/helm/agentic-web-research
      - run: helm template agentic-web-research deploy/helm/agentic-web-research >/dev/null

  image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ricsam/agentic-web-research:${{ github.sha }}
            ghcr.io/ricsam/agentic-web-research:latest

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Verify chart version matches tag
        run: |
          chart_version="$(helm show chart deploy/helm/agentic-web-research | awk '/^version:/ {print $2}')"
          test "v${chart_version}" = "${GITHUB_REF_NAME}"
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | helm registry login ghcr.io --username "${{ secrets.GHCR_USERNAME }}" --password-stdin
      - name: Package and publish chart
        run: |
          mkdir -p .helm-package
          helm package deploy/helm/agentic-web-research --destination .helm-package
          helm push ".helm-package/agentic-web-research-${GITHUB_REF_NAME#v}.tgz" oci://ghcr.io/ricsam/charts
