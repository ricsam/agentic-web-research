services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: agentic-web-research:local
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8080
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://agentic_web_research:agentic_web_research@postgres:5432/agentic_web_research
      APP_SECRET: ${APP_SECRET:-replace-this-with-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SEARXNG_URL: http://searxng:8080
      ADMIN_DIST_DIR: ../admin/dist
      CHART_REPO_DIR: ../../deploy/helm/repo
      PLAYWRIGHT_HEADLESS: "true"
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      BOOTSTRAP_LLM_ENDPOINT: ${BOOTSTRAP_LLM_ENDPOINT:-}
      BOOTSTRAP_LLM_MODEL: ${BOOTSTRAP_LLM_MODEL:-}
      BOOTSTRAP_LLM_API_KEY: ${BOOTSTRAP_LLM_API_KEY:-}
      BOOTSTRAP_LLM_HEADERS_JSON: ${BOOTSTRAP_LLM_HEADERS_JSON:-{}}
      MAX_ACTIVE_RESEARCH_TASKS: ${MAX_ACTIVE_RESEARCH_TASKS:-4}
      MAX_ACTIVE_PAGE_RENDERS: ${MAX_ACTIVE_PAGE_RENDERS:-8}
      DEMO_RESEARCH_ENABLED: ${DEMO_RESEARCH_ENABLED:-true}
      DEMO_RESEARCH_RATE_LIMIT_WINDOW_MS: ${DEMO_RESEARCH_RATE_LIMIT_WINDOW_MS:-600000}
      DEMO_RESEARCH_RATE_LIMIT_MAX: ${DEMO_RESEARCH_RATE_LIMIT_MAX:-5}
      DEMO_RESEARCH_MAX_CONCURRENCY: ${DEMO_RESEARCH_MAX_CONCURRENCY:-2}
      DEMO_RESEARCH_MAX_DEPTH: ${DEMO_RESEARCH_MAX_DEPTH:-2}
      DEMO_RESEARCH_MAX_PAGES: ${DEMO_RESEARCH_MAX_PAGES:-4}
      DEMO_RESEARCH_PAGE_TIMEOUT_MS: ${DEMO_RESEARCH_PAGE_TIMEOUT_MS:-15000}
      DEMO_RESEARCH_TIMEOUT_MS: ${DEMO_RESEARCH_TIMEOUT_MS:-120000}
    ports:
      - "8080:8080"
    shm_size: 512mb
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_web_research
      POSTGRES_USER: agentic_web_research
      POSTGRES_PASSWORD: agentic_web_research
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_web_research -d agentic_web_research"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1::5432"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      BASE_URL: http://localhost:8081/
      INSTANCE_NAME: agentic-web-research
    ports:
      - "8081:8080"
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
