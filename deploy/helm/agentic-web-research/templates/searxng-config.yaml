{{- if and .Values.searxng.enabled (not .Values.searxng.existingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-searxng
data:
  settings.yml: |
    use_default_settings: true

    server:
      secret_key: "overridden-by-SEARXNG_SECRET"
      limiter: false
      image_proxy: false

    search:
      formats:
        - html
        - json
{{- end }}
