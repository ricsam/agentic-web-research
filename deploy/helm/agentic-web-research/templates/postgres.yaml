{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "agentic-web-research.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-postgres
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}

