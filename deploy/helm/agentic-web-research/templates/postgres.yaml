{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-postgres
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-postgres
spec:
  serviceName: {{ include "agentic-web-research.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-postgres
    spec:
      automountServiceAccountToken: false
      {{- include "agentic-web-research.placement" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      {{- if .Values.postgres.existingDataGuard.enabled }}
      initContainers:
        - name: migration-existing-pgdata-guard
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - 'test -s "$PGDATA/global/pg_control"; test "$(cat "$PGDATA/PG_VERSION")" = "16"; test -d "$PGDATA/base"; echo ORIGINAL_PGDATA_GUARD_PASSED > /dev/termination-log; echo ORIGINAL_PGDATA_GUARD_PASSED'
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              readOnly: true
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.postgresPassword }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
{{- end }}
