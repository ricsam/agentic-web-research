apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-web-research.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: {{ .Values.env.publicBaseUrl | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.env.adminEmail | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.adminPassword }}
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.appSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.postgresPassword }}
            - name: DATABASE_URL
              {{- if .Values.postgres.externalDatabaseUrl }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.databaseUrl }}
              {{- else }}
              value: "postgres://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@{{ include "agentic-web-research.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
              {{- end }}
            - name: SEARXNG_URL
              value: {{- if .Values.searxng.externalUrl }} {{ .Values.searxng.externalUrl | quote }}{{- else }} "http://{{ include "agentic-web-research.fullname" . }}-searxng:8080"{{- end }}
            - name: BOOTSTRAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.bootstrapApiKey }}
                  optional: true
            - name: BOOTSTRAP_LLM_ENDPOINT
              value: {{ .Values.bootstrapLlm.endpoint | quote }}
            - name: BOOTSTRAP_LLM_MODEL
              value: {{ .Values.bootstrapLlm.model | quote }}
            - name: BOOTSTRAP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.bootstrapLlmApiKey }}
                  optional: true
            - name: BOOTSTRAP_LLM_HEADERS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.bootstrapLlmHeadersJson }}
                  optional: true
            - name: BOOTSTRAP_LLM_TEMPERATURE
              value: {{ .Values.bootstrapLlm.temperature | quote }}
            - name: BOOTSTRAP_LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.bootstrapLlm.maxOutputTokens | quote }}
            - name: MAX_ACTIVE_RESEARCH_TASKS
              value: {{ .Values.capacity.maxActiveResearchTasks | quote }}
            - name: MAX_ACTIVE_PAGE_RENDERS
              value: {{ .Values.capacity.maxActivePageRenders | quote }}
            - name: CAPACITY_RETRY_AFTER_SECONDS
              value: {{ .Values.capacity.retryAfterSeconds | quote }}
            - name: ADMIN_DIST_DIR
              value: ../admin/dist
            - name: CHART_REPO_DIR
              value: {{ .Values.chartRepoDir | quote }}
            - name: PLAYWRIGHT_HEADLESS
              value: "true"
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: {{ .Values.playwright.browsersPath | quote }}
            - name: HOME
              value: /tmp/home
            - name: DEMO_RESEARCH_ENABLED
              value: {{ .Values.demo.enabled | quote }}
            - name: DEMO_RESEARCH_RATE_LIMIT_WINDOW_MS
              value: {{ .Values.demo.rateLimitWindowMs | quote }}
            - name: DEMO_RESEARCH_RATE_LIMIT_MAX
              value: {{ .Values.demo.rateLimitMax | quote }}
            - name: DEMO_RESEARCH_MAX_CONCURRENCY
              value: {{ .Values.demo.maxConcurrency | quote }}
            - name: DEMO_RESEARCH_MAX_DEPTH
              value: {{ .Values.demo.maxDepth | quote }}
            - name: DEMO_RESEARCH_MAX_PAGES
              value: {{ .Values.demo.maxPages | quote }}
            - name: DEMO_RESEARCH_PAGE_TIMEOUT_MS
              value: {{ .Values.demo.pageTimeoutMs | quote }}
            - name: DEMO_RESEARCH_TIMEOUT_MS
              value: {{ .Values.demo.timeoutMs | quote }}
          {{- if .Values.playwright.installBrowsersOnStartup }}
          command:
            - /usr/bin/tini
            - -g
            - --
            - sh
            - -lc
          args:
            - cd /app/apps/server && bun node_modules/playwright/cli.js install chromium && exec bun src/index.ts
          {{- end }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
