{{- if .Values.searxng.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-searxng
    spec:
      automountServiceAccountToken: false
      {{- include "agentic-web-research.placement" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.searxng.podSecurityContext | nindent 8 }}
      containers:
        - name: searxng
          image: {{ .Values.searxng.image | quote }}
          {{- with .Values.searxng.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.searxng.securityContext | nindent 12 }}
          ports:
            - containerPort: 8080
          env:
            - name: INSTANCE_NAME
              value: agentic-web-research
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-web-research.secretName" . }}
                  key: {{ .Values.secretKeys.searxngSecret }}
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ default (printf "%s-searxng" (include "agentic-web-research.fullname" .)) .Values.searxng.existingConfigMap | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-searxng
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-searxng
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
