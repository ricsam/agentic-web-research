{{- if .Values.searxng.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-searxng
    spec:
      containers:
        - name: searxng
          image: {{ .Values.searxng.image | quote }}
          ports:
            - containerPort: 8080
          env:
            - name: INSTANCE_NAME
              value: agentic-web-research
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "agentic-web-research.fullname" . }}-searxng
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-web-research.fullname" . }}-searxng
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentic-web-research.name" . }}-searxng
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
