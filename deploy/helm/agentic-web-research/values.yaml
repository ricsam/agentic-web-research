image:
  repository: ghcr.io/ricsam/agentic-web-research
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1
existingSecret: agentic-web-research-secrets

secretKeys:
  appSecret: APP_SECRET
  adminPassword: ADMIN_PASSWORD
  postgresPassword: POSTGRES_PASSWORD
  databaseUrl: DATABASE_URL
  bootstrapApiKey: BOOTSTRAP_API_KEY
  bootstrapLlmApiKey: BOOTSTRAP_LLM_API_KEY
  bootstrapLlmHeadersJson: BOOTSTRAP_LLM_HEADERS_JSON
  searxngSecret: SEARXNG_SECRET

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  hosts:
    - host: agentic-web-research.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  publicBaseUrl: http://agentic-web-research.local
  adminEmail: admin@example.com

bootstrapLlm:
  endpoint: ""
  model: ""
  temperature: 0.2
  maxOutputTokens: 4096

capacity:
  maxActiveResearchTasks: 4
  maxActivePageRenders: 8
  retryAfterSeconds: 10

chartRepoDir: ../../deploy/helm/repo

demo:
  enabled: true
  rateLimitWindowMs: 600000
  rateLimitMax: 5
  maxConcurrency: 2
  maxDepth: 2
  maxPages: 4
  pageTimeoutMs: 15000
  timeoutMs: 120000

postgres:
  enabled: true
  image: postgres:16-alpine
  database: agentic_web_research
  username: agentic_web_research
  storageSize: 10Gi
  storageClassName: rook-ceph-block
  externalDatabaseUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

searxng:
  enabled: true
  image: searxng/searxng:latest
  externalUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

playwright:
  browsersPath: /ms-playwright
  installBrowsersOnStartup: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeral-storage: 2Gi

networkPolicy:
  enabled: false
  r5dAppPodSelector:
    app: r5d-dev
