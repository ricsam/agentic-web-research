image:
  repository: agentic-web-research
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  hosts:
    - host: agentic-web-research.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  publicBaseUrl: http://agentic-web-research.local
  adminEmail: admin@example.com
  adminPassword: change-me-now
  appSecret: replace-this-with-a-long-random-secret

chartRepoDir: ../../deploy/helm/repo

demo:
  enabled: true
  rateLimitWindowMs: 600000
  rateLimitMax: 5
  maxConcurrency: 2
  maxDepth: 2
  maxPages: 4
  pageTimeoutMs: 15000
  timeoutMs: 120000

postgres:
  enabled: true
  image: postgres:16-alpine
  database: agentic_web_research
  username: agentic_web_research
  password: agentic_web_research
  storageSize: 10Gi
  storageClassName: rook-ceph-block
  externalDatabaseUrl: ""

searxng:
  enabled: true
  image: searxng/searxng:latest
  secretKey: agentic-web-research-change-this-secret
  externalUrl: ""

playwright:
  browsersPath: /ms-playwright
  # Enable this for deployments that need to repair or populate browser binaries at pod startup.
  # The Docker image normally includes browsers at build time.
  installBrowsersOnStartup: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 2Gi
